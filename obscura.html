<html lang="en">
  <head>
    <title>Document</title>
  </head>

  <body>
    <canvas id="display" width="1000" height="1000"></canvas>
    <script>
      const canvas = document.getElementById("display");
      const gl = canvas.getContext("webgl2");

      gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
      gl.clearColor(1, 1, 1, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      const distance = 3;
      const far = 1000;
      var obsCameraPositions = [-1, 1, 0, -1, -1, 0, 1, 1, 0, 1, -1, 0];
      var obsCameraColor = [
        0.7, 0.9, 1.0, 0.8, 0.7, 0.9, 1.0, 0.8, 0.7, 0.9, 1.0, 0.8, 0.7, 0.9,
        1.0, 0.8,
      ];
      var pointColor = [1.0, 1.0, 1.0, 1.0];
      var insideRayColor = [0.8, 0.8, 0.8, 1.0, 0.8, 0.8, 0.8, 1.0];
      var rayColor = [0, 0, 0, 1, 0, 0, 0, 1];
      var rayPosition = [0, 0, distance, 0, 0, 0];
      var insideRayPosition = [0, 0, 0, -0, -0, -distance];

      function createShader(gl, type, source) {
        var shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        var success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
        if (success) {
          return shader;
        }

        console.log(gl.getShaderInfoLog(shader));

        // TODO: clean up resources id they are not used anymore
        gl.deleteShader(shader);
      }

      const vertexShader = createShader(
        gl,
        //shader type
        gl.VERTEX_SHADER,

        `  
        attribute vec3 a_position;
        attribute vec4 a_color;

        varying vec4 v_color;

        void main() {
          float w = a_position.z == 0.0
            ? 1.0
            : abs(a_position.z);

          gl_Position = vec4(
            a_position.x,
            a_position.y,
            a_position.z,
            w
          );

          gl_PointSize = 10.0;
          v_color = a_color;
          }
        `,
      );

      const fragmentShader = createShader(
        gl,
        gl.FRAGMENT_SHADER,

        `
          precision mediump float; 
          varying vec4 v_color;
   
          void main() {
            gl_FragColor = v_color;
          }
        `,
      );

      // Pipeline assembly
      function createProgram(gl, vertexShader, fragmentShader) {
        var program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        var success = gl.getProgramParameter(program, gl.LINK_STATUS);
        if (success) {
          return program;
        }

        console.log(gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
      }

      function createBuffers(gl, buffer, drawingType = gl.STATIC_DRAW) {
        const someBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, someBuffer);

        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(buffer), drawingType);

        return someBuffer;
      }

      function initBuffes(name, bufferData, bufferSize) {
        const attributeLocation = gl.getAttribLocation(program, name);
        // TODO: Прочитать
        gl.enableVertexAttribArray(attributeLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, bufferData);

        // Tell the attribute how to get data out of positionBuffer (ARRAY_BUFFER)
        var size = bufferSize; // 2 components per iteration
        var type = gl.FLOAT; // the data is 32bit floats
        var normalize = false; // don't normalize the data
        var stride = 0; // 0 = move forward size * sizeof(type) each iteration to get the next position
        var offset = 0; // start at the beginning of the buffer
        gl.vertexAttribPointer(
          attributeLocation,
          size,
          type,
          normalize,
          stride,
          offset,
        );
      }

      function render(
        gl,
        program,
        positionBuffer,
        colorBuffer,
        primitiveType,
        vertexCount,
      ) {
        gl.useProgram(program);

        initBuffes("a_position", positionBuffer, 3);
        initBuffes("a_color", colorBuffer, 4);

        var primitiveType = primitiveType;
        var offset = 0;
        var count = vertexCount;
        gl.drawArrays(primitiveType, offset, count);
      }

      const program = createProgram(gl, vertexShader, fragmentShader);

      const rayColorBuffer = createBuffers(gl, rayColor);
      const insideRayColorBuffer = createBuffers(gl, insideRayColor);
      const pointPositionBuffer = createBuffers(gl, [0, 0, 0]);
      const pointColorBuffer = createBuffers(gl, pointColor);
      const obsCameraPositionBuffer = createBuffers(gl, obsCameraPositions);
      const obsCameraColorBuffer = createBuffers(gl, obsCameraColor);
      const rayPositionBuffer = createBuffers(gl, rayPosition, gl.DYNAMIC_DRAW);
      const insideRayPositionBuffer = createBuffers(
        gl,
        insideRayPosition,
        gl.DYNAMIC_DRAW,
      );

      render(
        gl,
        program,
        obsCameraPositionBuffer,
        obsCameraColorBuffer,
        // TRIANGLE_STRIP делает новый треугольник с двумя предыдущими вершинами
        gl.TRIANGLE_STRIP,
        4,
      );

      function refreshBufferData(buffer, bufferData) {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array(bufferData),
          gl.DYNAMIC_DRAW,
        );
      }

      canvas.addEventListener("click", (event) => {
        const {
          x: canvasX,
          y: canvasY,
          width: canvasWidth,
          height: canvasHeight,
        } = canvas.getBoundingClientRect();

        const x = ((event.clientX - canvasX) / canvasWidth) * 2 - 1;
        const y = -((event.clientY - canvasY) / canvasHeight) * 2 + 1;

        rayPosition = [far * x, far * y, far, 0, 0, 0];
        refreshBufferData(rayPositionBuffer, rayPosition);

        insideRayPosition = [
          0,
          0,
          0,
          -(x * distance),
          -(y * distance),
          -distance,
        ];
        refreshBufferData(insideRayPositionBuffer, insideRayPosition);

        gl.clear(gl.COLOR_BUFFER_BIT);

        render(
          gl,
          program,
          obsCameraPositionBuffer,
          obsCameraColorBuffer,
          gl.TRIANGLE_STRIP,
          4,
        );
        render(
          gl,
          program,
          pointPositionBuffer,
          pointColorBuffer,
          gl.POINTS,
          1,
        );
        render(gl, program, rayPositionBuffer, rayColorBuffer, gl.LINES, 2);
        render(
          gl,
          program,
          insideRayPositionBuffer,
          insideRayColorBuffer,
          gl.LINES,
          2,
        );
      });
    </script>
  </body>
</html>

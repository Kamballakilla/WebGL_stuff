<html lang="en">
  <head>
    <title>Document</title>
  </head>

  <body>
    <canvas id="display"></canvas>
    <script>
      const canvas = document.getElementById("display");

      // TODO: OpenGL driver interface
      const gl = canvas.getContext("webgl");

      window.addEventListener("click", (event) => {
        console.log(event.clientX, event.clientY);
        console.log(gl.getParameter(gl.VIEWPORT));
      });

      canvas.width = 1000;
      canvas.height = 1000;

      function createShader(gl, type, source) {
        var shader = gl.createShader(type);

        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        var success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
        if (success) {
          return shader;
        }

        console.log(gl.getShaderInfoLog(shader));

        // TODO: clean up resources id they are not used anymore
        gl.deleteShader(shader);
      }

      const vertexShader = createShader(
        gl,
        //shader type
        gl.VERTEX_SHADER,

        `  
            attribute vec4 a_position;
            
            void main() {
                gl_Position = vec4(a_position.x,a_position.y,a_position.z, 1.0 + a_position.z) ;
            }
        `,
      );

      const fragmentShader = createShader(
        gl,
        gl.FRAGMENT_SHADER,

        `
            precision mediump float; 
 
            void main() {
                gl_FragColor = vec4(0, 0, gl_FragCoord.z, 1); // return reddish-purple
            }
        `,
      );

      // Pipeline assembly
      function createProgram(gl, vertexShader, fragmentShader) {
        var program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        var success = gl.getProgramParameter(program, gl.LINK_STATUS);
        if (success) {
          return program;
        }

        console.log(gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
      }

      const program = createProgram(gl, vertexShader, fragmentShader);

      function createBuffers(gl) {
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

        var positions = [
          -1, -1, 0, 1, -1, 0, 1, 1, 0, 1, 1, 0, -1, 1, 0,
          -1, -1, 0,
        ];

        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array(positions),
          gl.STATIC_DRAW,
        );

        return positionBuffer;
      }

      function render(gl, program, positionBuffer) {
        gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
        gl.clearColor(1, 1, 1, 1);

        // only color
        gl.clear(gl.COLOR_BUFFER_BIT);

        // color and z-buffer (побитовые операции)
        // gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        gl.useProgram(program);

        const positionAttributeLocation = gl.getAttribLocation(
          program,
          "a_position",
        );
        // TODO: Прочитать
        gl.enableVertexAttribArray(positionAttributeLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

        // Tell the attribute how to get data out of positionBuffer (ARRAY_BUFFER)
        var size = 3; // 2 components per iteration
        var type = gl.FLOAT; // the data is 32bit floats
        var normalize = false; // don't normalize the data
        var stride = 0; // 0 = move forward size * sizeof(type) each iteration to get the next position
        var offset = 0; // start at the beginning of the buffer
        gl.vertexAttribPointer(
          positionAttributeLocation,
          size,
          type,
          normalize,
          stride,
          offset,
        );

        var primitiveType = gl.TRIANGLES;
        var offset = 0;
        var count = 6;
        gl.drawArrays(primitiveType, offset, count);
      }

      const positionBuffer = createBuffers(gl);

      render(gl, program, positionBuffer);
    </script>
  </body>
</html>

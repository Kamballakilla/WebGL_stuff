<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="canvas" width="1000" height="1000"></canvas>
    <script id="vs" type="text/x-glsl">#version 300 es

precision highp float;

layout (location = 0) in vec3 aPos;
out vec3 vPos;
void main() {
    gl_Position = vec4(aPos, 1.0);
    vPos = aPos;
}
    </script>
    <script id="fs" type="text/x-glsl">#version 300 es

precision highp float;

in vec3 vPos;

out vec4 FragColor;

uniform float time;

mat2 rotate2d(float rad) {
    return mat2(
        cos(rad), -sin(rad),
        sin(rad), cos(rad)
    );
}

mat3 rotate3dY(float rad) {
    return mat3(
        cos(rad), 0.0, sin(rad),
        0.0, 1.0, 0.0,
        -sin(rad), 0.0, cos(rad)
    );
}

float op_union(float a, float b) {
    return min(a, b);
}

float op_union_smooth(float a, float b, float k) {
    k *= 4.0;
    float h = max(k - abs(a-b),0.0);
    return op_union(a, b) - h*h*0.25/k;
}

float d_sphere(vec3 p, vec3 c, float r) {
    return length(p - c) - r;
}

float d_scene(vec3 p) {
    vec3 v1 = vec3(0.3, 0.0, 0.0);
    float d1 = d_sphere(p, vec3(0.0, 0.0, 1.0) + v1 * rotate3dY(time), 0.5);
    float d2 = d_sphere(p, vec3(0.3, 0.6, 0.8) + v1 * rotate3dY(time * 0.8), 0.2);
    float d3 = d_sphere(p, vec3(-0.2, 0.6, 0.6) + v1 * rotate3dY(time) * 1.2, 0.1);
    return op_union_smooth(
        op_union_smooth(d1, d2, 0.025),
        d3,
        0.1
    );
}

vec3 norm_scene(vec3 p, float d0, float eps) {
    return normalize(vec3(
        d_scene(vec3(p.x + eps, p.y, p.z)) - d0,
        d_scene(vec3(p.x, p.y + eps, p.z)) - d0,
        d_scene(vec3(p.x, p.y, p.z + eps)) - d0
    ));
}

// All the magick is HERE
vec4 march(vec3 p0, vec3 dir, float eps) {
    vec3 p = p0;
    float d_min = 1e10;

    for (int i = 0; i < 100; i+= 1) {
        float d = d_scene(p);
        if (d < eps) {
            return vec4(p, d);
        }
        d_min = min(d, d_min);
        p += dir * d;
    }
    return vec4(0.0, 0.0, 0.0, -d_min);
}

float light_spec(vec3 p, vec3 norm, vec3 lightPos, vec3 camDir) {
    vec3 reflected = reflect(camDir, norm);
    vec3 toLight = normalize(lightPos - p);
    float spec = clamp(pow(dot(reflected, toLight), 100.5), 0.0, 1.0);
    return spec;
}

float light_point(vec3 p, vec3 norm, vec3 lightPos, vec3 camDir) {
    vec3 toLight = normalize(lightPos - p);
    float eps = 0.001;

    // Shading
    vec4 occluder = march(lightPos, -toLight, eps);
    float dist = length(p - occluder.xyz);
    float shadow = clamp(1.0 - dist, 0.0, 1.0) / 1.0;

    // Kinda Phong
    float diffuse = clamp(dot(toLight, norm), 0.0, 1.0);
    float spec = light_spec(p, norm, lightPos, camDir);

    return (0.2 * spec + diffuse) * shadow;
}

vec3 light_scene(vec3 p0, vec3 norm, vec3 camDir) {
    vec2 ring1 = vec2(10.0, 0.0) * rotate2d(time);
    vec3 light1 = vec3(1.0, ring1.x, ring1.y);
    vec2 ring2 = vec2(10.0, 0.0) * rotate2d(0.5 + time * 0.9);
    vec3 light2 = vec3(ring2.x, 1.0, ring2.y);
    vec2 ring3 = vec2(10.0, 0.0) * rotate2d(0.9 + time * 1.1);
    vec3 light3 = vec3(ring3.x, ring3.y, 1.0);

    vec3 color = (
        light_point(p0.xyz, norm, light1, camDir) * vec3(0.75, 0.15, 0.1) + 
        light_point(p0.xyz, norm, light2, camDir) * vec3(0.15, 0.75, 0.1) + 
        light_point(p0.xyz, norm, light3, camDir) * vec3(0.1, 0.15, 0.75)
    );
    return color;
}

void main() {
    vec4 bg = vec4(0.15, 0.1, 0.0, 1.0);
    float eps = 0.0001;
    vec3 camPos = vec3(0.0, 0.3, -1.0);
    vec3 camDir = normalize(vec3(vPos.x, vPos.y, 1.0) - camPos);

    // Direct light
    vec4 p0 = march(camPos, camDir, eps);
    if (p0.w < 0.0) {
        FragColor = bg;
        return;
    }
    vec3 norm0 = norm_scene(p0.xyz, p0.w, eps);
    vec3 color = light_scene(p0.xyz, norm0, camDir);

    // Reflection
    vec3 p1Dir = reflect(camDir, norm0);
    vec4 p1 = march(p0.xyz + p1Dir * eps, p1Dir, eps);
    vec3 norm1 = norm_scene(p1.xyz, p1.w, eps);
    vec3 reflect_color = vec3(0.0);
    if (p1.w > 0.0) {
        reflect_color = clamp(light_scene(p1.xyz, norm1, camDir) + p1.w, 0.0, 1.0) *
            pow(1.0 - abs(dot(camDir, norm0)), 0.5) * 0.5;
    }

    vec3 ambient = vec3(0.2, 0.15, 0.0);

    FragColor = vec4(ambient + color + reflect_color, 1.0);
}
    </script>
    <script>
        const canvas = document.getElementById("canvas");
        const gl = canvas.getContext("webgl2");

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            const success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
            if (!success) {
                console.error(gl.getShaderInfoLog(shader));
                throw Error("shader not compiled");
            }
            return shader;
        }

        function createProgram(vs_source, fs_source) {
            const program = gl.createProgram();
            const vs = compileShader(gl.VERTEX_SHADER, vs_source);
            const fs = compileShader(gl.FRAGMENT_SHADER, fs_source);
            gl.attachShader(program, vs);
            gl.attachShader(program, fs);
            gl.linkProgram(program);
            const success = gl.getProgramParameter(program, gl.LINK_STATUS);
            if (!success) {
                console.error(gl.getProgramInfoLog(program));
                throw Error("program not linked");
            }
            return program;
        }

        function createBuffer(vertices) {
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
            return buffer;
        }

        function render(program, buffer) {
            const t = performance.now() / 1000;
            gl.viewport(0, 0, canvas.clientWidth, canvas.clientHeight);
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            const position_loc = gl.getAttribLocation(program, "aPos");
            gl.enableVertexAttribArray(position_loc);
            gl.vertexAttribPointer(position_loc, 3, gl.FLOAT, false, 0, 0);

            gl.useProgram(program);
            const time_loc = gl.getUniformLocation(program, "time");
            gl.uniform1f(time_loc, t);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function main() {
            const program = createProgram(vs.innerText, fs.innerText);

            const buffer = createBuffer([
                -1, -1, 0,
                1, -1, 0,
                -1, 1, 0,
                1, 1, 0
            ]);

            const frame = () => {
                render(program, buffer);
                requestAnimationFrame(frame);
            };

            frame();
        }

        main();
    </script>
</body>
</html>
